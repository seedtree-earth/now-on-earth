<!doctype html>
<html lang="en-AU" data-theme="morning">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Now on Earth</title>
    <meta name="description" content="A clock that tells time by light. Find yourself on the globe and read the hour by where you sit in the sun." />
    <meta name="theme-color" content="#f4eee1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1712" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Same pre-paint theme script and storage key as SeedTree V2, so the
         night forest never flashes morning first. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("seedtree-theme");
          var m = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = s || (m ? "night" : "morning");
        } catch (e) {
          document.documentElement.dataset.theme = "morning";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:wght@400..600&display=swap"
    />
  </head>
  <body>
    <main class="shell">
      <div id="globe" class="globe" role="img" aria-label="A globe lit by the sun" aria-describedby="light-words"></div>

      <!-- Everything the clock says: down the left on a wide screen; on a
           phone the words sit above the globe and the cards just over the dock. -->
      <div class="info" id="info">
        <header class="face">
          <p class="eyebrow">Now on Earth</p>
          <h1 class="phase" id="phase" aria-hidden="true">&nbsp;</h1>
          <p class="sky" id="sky" aria-hidden="true">&nbsp;</p>
          <p class="moonline" id="moonline" aria-hidden="true" hidden></p>
          <p class="eventline" id="eventline" aria-hidden="true" hidden></p>
          <p class="deepline" id="deepline" aria-hidden="true" hidden></p>
          <p class="where" id="where" aria-hidden="true">&nbsp;</p>
        </header>

        <!-- A tapped place, a person or node, an event: its card. -->
        <aside id="pick" class="pick" aria-live="polite" hidden></aside>

        <div id="guide-panel" class="guide" role="region" aria-label="Guide to the clock" hidden></div>
      </div>

      <!-- What is under the pointer: a visual extra; the Guide says the same in full. -->
      <div id="hover-tip" class="hover-tip" aria-hidden="true" hidden></div>

      <!-- What a screen reader hears: the light, in words. -->
      <p id="light-words" class="sr-only" aria-live="polite" aria-atomic="true"></p>

      <div id="notice" class="notice" hidden></div>

      <section class="dock" aria-label="Clock controls">
        <!-- How deep to look: the day, the year, or deep time. One scale at a time. -->
        <div class="depth" role="radiogroup" aria-label="How far to look">
          <button type="button" role="radio" data-scale="day" aria-checked="true">Day</button>
          <button type="button" role="radio" data-scale="year" aria-checked="false">Year</button>
          <button type="button" role="radio" data-scale="deep" aria-checked="false">Deep time</button>
        </div>
        <div class="sliders">
          <label class="slider" data-scale="day">
            <span class="slider-name">The day</span>
            <input id="scrub" type="range" min="-720" max="720" step="1" value="0" />
          </label>
          <div class="slider" data-scale="year" hidden>
            <span class="slider-name" id="year-name">The year</span>
            <div class="track">
              <!-- The year's four turning points, placed where they fall. -->
              <div class="marks" id="year-marks" role="group" aria-label="Solstices and equinoxes"></div>
              <input id="season" type="range" min="-182" max="182" step="1" value="0" aria-labelledby="year-name" />
            </div>
          </div>
          <div class="slider" data-scale="deep" hidden>
            <span class="slider-name" id="deep-name">Deep time</span>
            <div class="track deep-track">
              <input id="deep" type="range" min="0" max="1000" step="1" value="0" aria-labelledby="deep-name" />
              <!-- Named moments, not figures: the years are in the words. -->
              <div class="deep-marks" id="deep-marks" role="group" aria-label="Moments in deep time"></div>
            </div>
          </div>
        </div>
        <div id="layers-panel" class="layers" role="group" aria-label="What the globe shows" hidden>
          <!-- The lenses are built from the layer list in lens-panel.ts. -->
          <div id="lenses" class="lenses"></div>
          <div class="panel-group">
            <label class="switch"><input type="checkbox" id="flat-model" /><span>Flat model</span></label>
          </div>
        </div>
        <!-- The pace of play: shown while the sun is moving. -->
        <label class="slider pace" id="pace-row" hidden>
          <span class="slider-name">Pace <em id="pace-word">days</em></span>
          <input id="pace" type="range" min="0" max="4" step="1" value="2" />
        </label>
        <div class="buttons">
          <button id="play" class="btn" type="button" aria-pressed="false" title="Let the sun move">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5.5v13l10.5-6.5z" /><path class="i-pause" d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" /></svg>
            <span class="btn-label">Play</span>
          </button>
          <button id="now" class="btn" type="button" title="Back to this moment" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
            <span class="btn-label">Now</span>
          </button>
          <button id="face-sun" class="btn" type="button" aria-pressed="false" title="Keep the sun in view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></g></svg>
            <span class="btn-label">Face the sun</span>
          </button>
          <button id="face-me" class="btn" type="button" title="Come back to where you are">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6" /><circle cx="12" cy="10" r="2.4" /></svg>
            <span class="btn-label">Face me</span>
          </button>
          <button id="guide" class="btn" type="button" aria-expanded="false" aria-controls="guide-panel" title="What everything means">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5.5" /><circle cx="12" cy="7.8" r="0.6" fill="currentColor" /></svg>
            <span class="btn-label">Guide</span>
          </button>
          <button id="layers" class="btn" type="button" aria-expanded="false" aria-controls="layers-panel" title="What the globe shows">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 4 3 8.5l9 4.5 9-4.5z" /><path d="m3 12.5 9 4.5 9-4.5" /><path d="m3 16.5 9 4.5 9-4.5" /></svg>
            <span class="btn-label">Layers</span>
          </button>
          <button id="theme" class="btn" type="button" title="Morning or night">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
            <span class="btn-label">Night</span>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
